
<main class="weather">
  <h1>Weather App</h1>
  <p>Check the weather in your city</p>

  <app-weather-search (search)="onSearch($event)" />

  @if (loading()) {
    <p class="loading" role="status">
      Loading weather...
    </p>
  }

  @if (error()) {
    <p class="error" role="alert">
      {{ error() }}
    </p>
  }

  @if (weather(); as currentWeather) {
    <app-weather-card [weather]="currentWeather" />
  }
</main>
